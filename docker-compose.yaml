services:
  app:
    build: .
    environment:
      GREETING: "${GREETING:-Hello, Docker!}"
    ports:
      - "${PORT:-8080}:8000"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  
  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
      
volumes:
  redis-data: